name: eatoggy
description: Premium Food Ordering and Meal Subscription Customer Mobile App.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.3
  go_router: ^12.1.3
  dio: ^5.4.0
  google_fonts: ^6.1.0
  equatable: ^2.0.5
  intl: ^0.19.0
  shimmer: ^3.0.0
  sizer: ^3.1.3
  url_launcher: ^6.3.2
  in_app_update: ^4.2.5
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/appicon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
